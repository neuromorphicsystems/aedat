[package]
name = "aedat"
version = "2.3.0"
edition = "2021"
resolver = "2"

[lib]
name = "aedat"
crate-type = ["cdylib"]

[dependencies]
flatbuffers = "25.12.19"
lz4 = "1.28.1"
numpy = "0.29.0"
pyo3 = {version = "0.29.2", features = ["extension-module"]}
roxmltree = "0.21.1"
zstd = "0.14.0"

[profile.release]
lto = true
codegen-units = 1
